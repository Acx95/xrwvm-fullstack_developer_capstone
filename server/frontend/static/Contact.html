<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us</title>
	<link rel="stylesheet" href="/static/style.css">
	<link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light contact-navbar">
		<div class="container-fluid">
			<h2 class="contact-brand">Dealerships</h2>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarText">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link" style="font-size: larger;" href="/">Home</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
					</li>
					<li class="nav-item">
						<a class="nav-link active" style="font-size: larger;" aria-current="page" href="/contact">Contact Us</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="contact-page">
		<section class="contact-card">
			<div class="contact-intro">
				<img src="/static/contactus.png" alt="Contact us">
				<div>
					<p class="contact-eyebrow">WE ARE HERE TO HELP</p>
					<h1>Contact Us</h1>
					<p class="contact-description">Visit us or get in touch with our team. We will be happy to help you find the right car.</p>
				</div>
			</div>

			<div class="contact-details">
				<div class="contact-detail">
					<span class="contact-detail-label">Phone</span>
					<a href="tel:+15551234567">+1 555 123 4567</a>
				</div>
				<div class="contact-detail">
					<span class="contact-detail-label">Email</span>
					<a href="mailto:info@bestcars.com">info@bestcars.com</a>
				</div>
				<div class="contact-detail">
					<span class="contact-detail-label">Address</span>
					<span>100 Main Street, Toronto</span>
				</div>
				<div class="contact-detail">
					<span class="contact-detail-label">Opening hours</span>
					<span>Mon - Sat, 9:00 AM - 6:00 PM</span>
				</div>
			</div>
		</section>
	</main>
</body>
</html>
